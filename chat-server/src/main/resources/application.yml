spring:
  application:
    name: chat-server
  datasource:
    url: ${CHAT_DB_URL:jdbc:sqlite:chat-server.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  address: 0.0.0.0

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

logging:
  level:
    com.chatapp: INFO
    org.springframework.web: INFO
