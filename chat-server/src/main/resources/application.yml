spring:
  application:
    name: chat-server
  datasource:
    url: jdbc:sqlite:chat-server.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  thymeleaf:
    cache: false

server:
  port: 8080
  address: 0.0.0.0

logging:
  level:
    com.chatapp: INFO
    org.springframework.web: INFO